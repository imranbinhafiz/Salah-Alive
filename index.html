<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="Understand what you say in every Salah — word by word, in English and Bangla. Turn mechanical prayer into conscious connection." />
  <title>Salah Alive</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <a class="topbar__brand" href="#/" data-link aria-label="Home">
      <span class="brand__mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          <circle cx="17.5" cy="6.5" r="1.3"/>
        </svg>
      </span>
      <span class="brand__name">Salah Alive</span>
    </a>
    <div class="topbar__controls">
      <div class="fontctl" role="group" aria-label="Text size">
        <button class="fontctl__btn" data-action="font-dec" aria-label="Smaller text">A&minus;</button>
        <button class="fontctl__btn" data-action="font-inc" aria-label="Larger text">A+</button>
      </div>
      <div class="langtoggle" role="group" aria-label="Language">
        <button class="langtoggle__btn" data-action="lang" data-lang="en">EN</button>
        <button class="langtoggle__btn" data-action="lang" data-lang="bn">বাংলা</button>
      </div>
    </div>
  </header>

  <!-- App mount -->
  <main id="app" class="app" tabindex="-1"></main>

  <!-- Bottom navigation -->
  <nav class="bottomnav" id="bottomnav" aria-label="Main navigation">
    <a class="bottomnav__item" href="#/" data-link data-nav="home">
      <span class="bottomnav__icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span class="bottomnav__label" data-ui="nav.home">Home</span>
    </a>
    <a class="bottomnav__item" href="#/salah" data-link data-nav="salah">
      <span class="bottomnav__icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
      <span class="bottomnav__label" data-ui="nav.salah">Salah</span>
    </a>
    <a class="bottomnav__item" href="#/surahs" data-link data-nav="surahs">
      <span class="bottomnav__icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span class="bottomnav__label" data-ui="nav.surahs">Surahs</span>
    </a>
    <a class="bottomnav__item" href="#/review" data-link data-nav="review">
      <span class="bottomnav__icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </span>
      <span class="bottomnav__label" data-ui="nav.review">Review</span>
    </a>
  </nav>

  <!-- Welcome — full page (first visit) -->
  <div class="welcome" id="welcome" hidden>
    <div class="welcome__mark" aria-hidden="true">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        <circle cx="17.5" cy="6.5" r="1.3"/>
      </svg>
    </div>
    <h1 class="welcome__title">Salah Alive</h1>
    <p class="welcome__sub">Learn what you say in every prayer — word by word.<br>নামাজে আপনি যা বলেন, তা বুঝুন — শব্দে শব্দে।</p>
    <div class="welcome__divider" aria-hidden="true"></div>
    <p class="welcome__choose">Choose your language · ভাষা বেছে নিন</p>
    <div class="welcome__actions">
      <button class="btn btn--primary btn--lg" data-action="welcome-lang" data-lang="en">English</button>
      <button class="btn btn--primary btn--lg" data-action="welcome-lang" data-lang="bn">বাংলা</button>
    </div>
  </div>

  <!-- Single reusable audio element -->
  <audio id="player" preload="none"></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
